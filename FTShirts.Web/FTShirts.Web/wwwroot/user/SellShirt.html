<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell a Shirt - FT-Shirts</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container mb-5 d-flex justify-content-center">
        <div class="container mt-4" style="max-width: 600px;">
            <h2>Sell a Second-Hand Shirt</h2>
            <div class="card p-4 mt-3 shadow-sm">
                <form id="sellShirtForm">

                    <div class="mb-3">
                        <label class="fw-bold">Team:</label>
                        <input type="text" id="team" name="team" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Price (€):</label>
                        <input type="number" step="0.01" id="price" name="price" class="form-control" required />
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="fw-bold">Player Name (Optional):</label>
                            <input type="text" id="pName" name="pName" class="form-control" />
                        </div>
                        <div class="col">
                            <label class="fw-bold">Player Number (Optional):</label>
                            <input type="number" id="pNumber" name="pNumber" class="form-control" />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Size:</label>
                        <select id="size" name="size" class="form-select" required>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold d-block mb-2">Tags:</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="tags" value="retro" id="tagRetro">
                                <label class="form-check-label" for="tagRetro">retro</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="tags" value="season" id="tagSeason">
                                <label class="form-check-label" for="tagSeason">season</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="tags" value="laLiga" id="tagLiga">
                                <label class="form-check-label" for="tagLiga">laLiga</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="tags" value="premier" id="tagPremier">
                                <label class="form-check-label" for="tagPremier">premier</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="tags" value="serieA" id="tagSerieA">
                                <label class="form-check-label" for="tagSerieA">serieA</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-bold">Publish Shirt</button>
                </form>
            </div>
        </div>
    </main>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site.js"></script>
    <script src="/js/sellShirt.js"></script>
</body>
</html>
