<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - FT-Shirts</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container mb-5">
        <div class="container mt-4">
            <h2>Shopping Cart</h2>

            <div id="emptyCartMessage" style="display: none;">
                <div class="alert alert-info mt-4">
                    Shopping cart is empty
                </div>
                <a href="/catalogue/Index.html" class="btn btn-primary mt-2">Return to shop</a>
            </div>

            <div id="cartContent">
                <table class="table table-striped align-middle mt-4">
                    <thead>
                        <tr>
                            <th>Team</th>
                            <th>Details</th>
                            <th class="text-end">Price</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                    </tbody>
                    <tfoot>
                        <tr class="table-dark">
                            <td colspan="2" class="text-end fw-bold">Total:</td>
                            <td class="text-end fw-bold fs-5"><span id="cartTotal">0.00</span> €</td>
                        </tr>
                    </tfoot>
                </table>

                <div class="d-flex justify-content-end mt-4">
                    <a href="/catalogue/Index.html" class="btn btn-outline-secondary me-3">Continue Shopping</a>
                    <button id="btnCheckout" class="btn btn-success fw-bold px-4">Go to payment</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
